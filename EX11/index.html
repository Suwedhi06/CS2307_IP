<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Place Order</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --panel-bg: #ffffff;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --text-dark: #1f2937;
            --text-gray: #4b5563;
            --border: #d1d5db;
            --focus-ring: rgba(79, 70, 229, 0.2);
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: var(--bg-gradient); 
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .form-card {
            width: 100%;
            max-width: 440px; 
            margin: 20px; 
            background: var(--panel-bg);
            padding: 40px; 
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            box-sizing: border-box;
        }
        h2 { 
            text-align: center; 
            color: var(--text-dark); 
            margin-top: 0;
            margin-bottom: 28px;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label { 
            display: block; 
            margin-bottom: 8px;
            font-weight: 600; 
            color: var(--text-dark); 
            font-size: 14px;
        }
        input[type="text"], 
        input[type="number"] {
            width: 100%; 
            padding: 12px 16px; 
            box-sizing: border-box;
            border: 1px solid var(--border); 
            border-radius: 8px;
            font-size: 15px;
            background-color: #f9fafb;
            color: var(--text-dark);
            transition: all 0.2s ease-in-out;
        }
        input:focus {
            outline: none;
            border-color: var(--primary);
            background-color: var(--panel-bg);
            box-shadow: 0 0 0 4px var(--focus-ring);
        }
        input[type="submit"] {
            width: 100%; 
            margin-top: 10px; 
            padding: 14px;
            background-color: var(--primary); 
            color: white; 
            border: none;
            border-radius: 8px; 
            font-size: 16px; 
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2);
        }
        input[type="submit"]:hover { 
            background-color: var(--primary-hover); 
            transform: translateY(-1px);
            box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.3);
        }
        input[type="submit"]:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="form-card">
        <h2>Enter Order Details</h2>
        <form action="insert_order.php" method="POST">
            <div class="form-group">
                <label>Customer Name</label>
                <input type="text" name="customer_name" placeholder="e.g. John Doe" required>
            </div>
            <div class="form-group">
                <label>Product Name</label>
                <input type="text" name="product_name" placeholder="e.g. Wireless Mouse" required>
            </div>
            <div class="form-group">
                <label>Quantity</label>
                <input type="number" name="quantity" min="1" placeholder="1" required>
            </div>
            <div class="form-group">
                <label>Price (per unit)</label>
                <input type="number" name="price" step="0.01" min="0" placeholder="0.00" required>
            </div>
            <input type="submit" value="Place Order">
        </form>
    </div>
</body>
</html>
